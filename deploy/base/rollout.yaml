# Rollout, not Deployment (Milestone 6, platform repo): this is the
# platform's production-grade default going forward -- canary steps with
# native Istio traffic routing (VirtualService+DestinationRule subsets,
# confirmed built into the Argo Rollouts controller itself, no plugin
# needed). The VirtualService/DestinationRule referenced below are NOT
# created here -- same division of responsibility this project already
# uses for HTTPRoutes: the app repo owns its workload shape, the platform
# repo wires per-app routing when onboarding (see
# platform/gateway-api/examples-{dev,prod}/ and CLAUDE.md's onboarding
# steps). This Rollout just declares the contract -- route by these two
# names once the platform repo creates them.
#
# A single Service (deploy/base/service.yaml, unchanged) still fronts both
# the stable and canary ReplicaSets: Istio's DestinationRule-subset
# approach splits traffic by injecting rollouts-pod-template-hash into
# each subset's label selector, not by standing up two separate Services.
#
# app.kubernetes.io/part-of is hardcoded on selector/template below,
# unlike every other kind in this base -- confirmed live this is
# necessary: kustomization.yaml's `labels` transformer (includeSelectors:
# true) only knows how to drill into well-known workload kinds' selector/
# podTemplate paths (Deployment, StatefulSet, ...), not an arbitrary CRD
# like Rollout. It still adds part-of to this object's own
# metadata.labels and to the Service's selector (both well-understood
# paths) -- but silently leaves spec.selector.matchLabels/spec.template
# untouched, which left the Service matching zero pods (Service selector
# requires both labels, pods only carried one) until this was hardcoded.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-world
  labels:
    app.kubernetes.io/name: hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-world
      app.kubernetes.io/part-of: local-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-world
        app.kubernetes.io/part-of: local-platform
      # Standard prometheus.io/* pod-annotation convention -- the
      # platform's OTel Collector (local-platform-lab's
      # gitops/dev/platform/otel-collector.yaml) discovers and scrapes any
      # pod carrying these annotations automatically, cluster-wide, no
      # platform-repo change needed per onboarded app. This is the whole
      # monitoring-onboarding story for a new app: nothing to configure,
      # since the template already sets it. Override port/path here only
      # if this app's /metrics ever moves off the default http port.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: hello-world
          image: ghcr.io/chliddle/local-platform-lab-app-template:placeholder
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: base
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            # distroless's nonroot USER is a symbolic name, not numeric --
            # kubelet can't verify runAsNonRoot against it without an
            # explicit numeric UID here. 65532 is distroless's well-known
            # nonroot UID.
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
  strategy:
    canary:
      trafficRouting:
        istio:
          virtualService:
            name: hello-world
            routes:
              - primary
          destinationRule:
            name: hello-world
            canarySubsetName: canary
            stableSubsetName: stable
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 100
