apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello-world

resources:
- ../../base

patches:
- path: patch-environment.yaml
  target:
    kind: Deployment
    name: hello-world

# Placeholder digest -- CI overwrites this with the real one via
# `kustomize edit set image` after building and pushing to GHCR.
# Reset to placeholder: the image moved from ghcr.io/.../hello-world to
# ghcr.io/.../local-platform-lab-app-1 (dynamic, ghcr.io/${{ github.repository }}),
# a fresh package under a name this repo's own workflow creates, avoiding
# the stale cross-repo package-linkage issue the old name had.
images:
- digest: sha256:f2a7a3d906c72a9057e18fa27981ec03444ebf5031c9f4e4d4fbd9893a2d7c64
  name: ghcr.io/chliddle/local-platform-lab-app-1
  newName: ghcr.io/chliddle/local-platform-lab-app-1
