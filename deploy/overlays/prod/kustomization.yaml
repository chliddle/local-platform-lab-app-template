apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hello-world

resources:
- ../../base

patches:
- path: patch-environment.yaml
  target:
    kind: Deployment
    name: hello-world

# Placeholder digest -- overwritten by .github/workflows/release.yml, which
# promotes the exact digest already validated in deploy/overlays/dev
# (never rebuilds) whenever semantic-release cuts a new version.
images:
- digest: sha256:cdfaf14b76f22e0e39b9597526be547248ada78c274b04f95eaf7cf606f69726
  name: ghcr.io/chliddle/hello-world
  newName: ghcr.io/chliddle/hello-world
