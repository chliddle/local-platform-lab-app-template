name: ci

# No pull_request trigger, deliberately: this repo's only collaborator is
# its owner (verified via the collaborators API), so a PR-triggered run
# would only ever come from a stranger's fork -- removing the trigger
# entirely means there's no path for anyone but the owner to run anything
# here at all, rather than relying on GitHub's fork-PR sandboxing to bound
# what a stranger's run could do. paths-ignore is unrelated to that: it
# keeps update-dev-digest's own commit from retriggering this workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"

env:
  # ghcr.io/<owner>/<repo-name> -- fully dynamic, so this file never needs
  # editing for a new app (see template-init.yml, which deliberately
  # avoids touching workflow files at all: GITHUB_TOKEN can never modify
  # .github/workflows/*, full stop, no permission grants it -- confirmed
  # by testing, not assumption).
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            echo "gofmt found unformatted files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Testing GITHUB_TOKEN again now that IMAGE is fully dynamic
      # (ghcr.io/${{ github.repository }}): the PAT workaround this repo
      # used previously was specifically because the OLD ghcr.io/.../
      # hello-world package had stale linkage from being created by a
      # different repo's workflow before the platform/app split. A
      # brand-new package under this new name, created by this repo's own
      # first push, should auto-link correctly -- if this reverts to
      # permission_denied again, switch back to CI_GITHUB_USERNAME/
      # CI_GITHUB_TOKEN as before.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
            GIT_COMMIT_SHA=${{ github.sha }}
          # This package's GHCR page showed the platform repo as its
          # "source" -- a sticky label from whenever the package was first
          # created, back when it was pushed by that repo's own CI, before
          # the app moved to its own repo. No push since has carried this
          # label at all (confirmed via `docker buildx imagetools inspect
          # --format '{{json .Image.Config.Labels}}'`, which returned null
          # for the latest image). Setting it explicitly here corrects it
          # going forward.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # Proves the app actually runs, not just that it builds: spins up a
  # throwaway Kind cluster (same node image the real dev/prod clusters
  # use), loads the just-built image directly (no registry involved),
  # applies deploy/base with that local image substituted in, and asserts
  # the platform's app contract (the 5 endpoints every app on this
  # platform must expose). Deliberately
  # bypasses Argo CD/GitOps here -- that path is what the platform repo's
  # own integration test exercises, against the real published image.
  smoke-test:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image (local only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: hello-world:smoke-test
          build-args: |
            VERSION=smoke-test
            GIT_COMMIT_SHA=${{ github.sha }}

      - name: Install kind and kustomize
        run: |
          curl -sLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          # install_kustomize.sh calls the unauthenticated GitHub releases
          # API to resolve the download URL -- shares the runner IP's 60/hr
          # rate limit with everything else hitting api.github.com, and was
          # observed failing ("Github rate-limiter failed the request") on
          # the platform repo's own CI. Downloading the pinned release
          # asset directly bypasses the API entirely.
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/kustomize_v5.4.2_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Create cluster
        run: |
          kind create cluster --name smoke-test \
            --image kindest/node:v1.29.2@sha256:51a1434a5397193442f0be2a297b488b6c919ce8a3931be0ce822606ea5ca245

      - name: Load image into cluster
        run: kind load docker-image hello-world:smoke-test --name smoke-test

      - name: Deploy
        run: |
          mkdir -p /tmp/smoke-deploy
          cp deploy/base/*.yaml /tmp/smoke-deploy/
          cd /tmp/smoke-deploy
          kustomize edit set image "$IMAGE"=hello-world:smoke-test
          kubectl apply -k .
          # Discovered, not assumed: this workflow file is never touched by
          # template-init.yml (GITHUB_TOKEN can't edit .github/workflows/*),
          # but the Deployment/Service *object names* it deploys ARE renamed
          # per-app by template-init. Hardcoding "hello-world" here worked
          # only for this template repo itself (never renamed, since
          # template-init skips it) and broke smoke-test on every actually
          # generated app -- confirmed via a real failing CI run.
          app_name=$(kubectl get deployment -o jsonpath='{.items[0].metadata.name}')
          echo "APP_NAME=$app_name" >> "$GITHUB_ENV"
          kubectl rollout status "deployment/$app_name" --timeout=90s

      - name: Smoke test
        run: |
          kubectl port-forward "svc/$APP_NAME" 18080:8080 &
          sleep 3
          bash scripts/smoke-test.sh http://localhost:18080

  # Patches the built digest into the dev overlay and commits it back to
  # main so Argo CD (in the platform repo's cluster) picks it up. Uses only
  # the default GITHUB_TOKEN -- self-service means this app team never needs
  # write access to the platform repo, only to its own. paths-ignore above
  # keeps this commit from retriggering the pipeline; GitHub's own rule that
  # pushes authenticated with the default token never trigger new workflow
  # runs is a second, independent guard against a commit loop.
  update-dev-digest:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # persist-credentials stays at its default (true): the "Commit and
      # push" step below needs the credential checkout leaves in
      # .git/config to push at all, and nothing else in this job runs
      # untrusted third-party code that could read it out from under a
      # legitimate step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: # zizmor: ignore[artipacked] needed for this job's own later git push
          ref: main

      - name: Install kustomize
        run: |
          # install_kustomize.sh calls the unauthenticated GitHub releases
          # API to resolve the download URL -- shares the runner IP's 60/hr
          # rate limit with everything else hitting api.github.com, and was
          # observed failing ("Github rate-limiter failed the request") on
          # the platform repo's own CI. Downloading the pinned release
          # asset directly bypasses the API entirely.
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/kustomize_v5.4.2_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Set image digest
        working-directory: deploy/overlays/dev
        env:
          BUILD_DIGEST: ${{ needs.build.outputs.digest }}
        run: kustomize edit set image "$IMAGE=$IMAGE@$BUILD_DIGEST"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "no change to dev overlay, skipping commit"
          else
            git commit -m "chore(deploy): deploy hello-world@${{ github.sha }} to dev"
            git push origin main
          fi
