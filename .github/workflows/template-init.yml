name: template-init

# Runs once, on the first push to a repo created from this template, and
# then no-ops forever after (guarded by a sentinel file, not by deleting
# itself -- GITHUB_TOKEN can never modify files under .github/workflows/,
# under any permissions configuration; confirmed by testing, not
# assumption). Renames the Go module path and app/Kubernetes-object name
# throughout the repo to match the new repo -- an app team using this
# template should never need to touch anything but their own application
# code. ci.yml/release.yml need no renaming at all: their IMAGE is
# ghcr.io/${{ github.repository }}, already correct for any repo from the
# first push.
on:
  push:
    branches: [main]

jobs:
  init:
    # Never runs on the template repo itself, only on repos generated from it.
    if: github.repository != 'chliddle/local-platform-lab-app-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # persist-credentials stays at its default (true): the "Commit" step
      # below needs the credential checkout leaves in .git/config to push
      # at all, and nothing else in this job runs untrusted third-party
      # code that could read it out from under a legitimate step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 # zizmor: ignore[artipacked] needed for this job's own later git push

      - name: Check whether this repo has already been initialized
        id: check
        run: |
          if [ -f .github/.template-initialized ]; then
            echo "already_initialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_initialized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename app throughout the repo
        if: steps.check.outputs.already_initialized == 'false'
        # REPO_NAME goes through env:, not a direct ${{ }} expansion in the
        # script below -- a repo name is GitHub-charset-constrained
        # (alphanumeric/hyphen/underscore/period only, no shell
        # metacharacters) so isn't practically exploitable here, but
        # interpolating any ${{ }} expression directly into a run: block is
        # a flagged anti-pattern (zizmor: template-injection) regardless of
        # whether a given value happens to be constrained today.
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          old_module="github.com/chliddle/local-platform-lab-app-template"
          new_module="github.com/${{ github.repository }}"

          old_repo="local-platform-lab-app-template"
          # Repo name, lowercased, with anything that isn't a valid
          # Kubernetes object name / GHCR image name char collapsed to
          # "-". Used both as the app/k8s-object name and, implicitly via
          # ci.yml's dynamic ghcr.io/${{ github.repository }}, the image
          # name -- keep repo names lowercase-hyphenated for these to
          # actually match.
          new_name="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g')"
          old_name="hello-world"

          echo "renaming module: $old_module -> $new_module"
          echo "renaming repo:   $old_repo -> $REPO_NAME"
          echo "renaming app:    $old_name -> $new_name"

          # Explicit file list, not grep-discovered: the Dockerfile also
          # references the module path (in its ldflags -X args) despite
          # not being a .go file or go.mod -- easy to miss with a
          # find/grep filtered by extension.
          find . -name "*.go" -not -path "./.git/*" -print0 | xargs -0 sed -i "s|$old_module|$new_module|g"
          sed -i "s|$old_module|$new_module|g" go.mod Dockerfile

          # Both the short app/object name and the repo/image name --
          # deploy manifests reference both (k8s object names use the
          # former, the image: line uses the latter).
          sed -i "s/$old_name/$new_name/g; s/$old_repo/$new_name/g" \
            main.go \
            Makefile \
            internal/buildinfo/buildinfo.go \
            internal/handlers/handlers_test.go \
            deploy/base/deployment.yaml \
            deploy/base/service.yaml \
            deploy/overlays/dev/kustomization.yaml \
            deploy/overlays/dev/patch-environment.yaml \
            deploy/overlays/prod/kustomization.yaml \
            deploy/overlays/prod/patch-environment.yaml

          sed -i "s/$old_repo/$REPO_NAME/g" package.json README.md

          # semantic-release infers repositoryUrl from the git remote
          # correctly for a freshly-generated repo (no rename/redirect
          # history to confuse it) -- drop the hardcoded override rather
          # than templating yet another value.
          python3 -c "
          import json
          with open('.releaserc.json') as f:
              config = json.load(f)
          config.pop('repositoryUrl', None)
          with open('.releaserc.json', 'w') as f:
              json.dump(config, f, indent=2)
              f.write('\n')
          "

          mkdir -p .github
          touch .github/.template-initialized

      - name: Commit
        if: steps.check.outputs.already_initialized == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialize app from template"
          git push origin main
