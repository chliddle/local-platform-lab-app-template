name: release

# Fires only once local-platform-lab's check-app-dev-health.yml has
# confirmed, against the REAL dev cluster's Argo CD Application (not just
# ci.yml's own isolated, throwaway-Kind-cluster smoke test), that the
# digest ci.yml just wrote to deploy/overlays/dev is actually
# Synced+Healthy -- see that repo's workflow for the check itself, and
# ci.yml's "Request dev health check" step for what triggers it.
#
# repository_dispatch, not workflow_run on ci.yml completing: that was the
# old trigger, and it only proved the isolated smoke test passed, with no
# dependency on real dev cluster health at all -- exactly the gap this
# change closes.
on:
  repository_dispatch:
    types: [dev-health-result]

# Never cancel an in-flight release; queue instead, so overlapping
# releases can't race each other.
concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  release:
    if: github.event.client_payload.status == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Deliberately checks out current main, not the commit the health
      # check ran against: by the time this dispatch arrives, main could in
      # principle have moved again. semantic-release refuses to release
      # from a commit it considers "behind" the remote HEAD, so pinning
      # here would be actively counterproductive -- same reasoning this
      # step already had before the trigger changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: # zizmor: ignore[artipacked] this job's semantic-release step needs push access to tag
          fetch-depth: 0 # semantic-release needs full history to analyze conventional commits

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      # Uses RELEASE_TOKEN (a PAT), not the default GITHUB_TOKEN: GitHub
      # never lets a push authenticated by the default token trigger a new
      # workflow run (recursive-trigger prevention), which would silently
      # stop the tag semantic-release pushes here from ever firing
      # promote-prod.yml's `on: push: tags:` trigger. Same PAT already used
      # for the platform-repo dispatch in ci.yml.
      - uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6
        id: semantic
        with:
          semantic_version: 25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
