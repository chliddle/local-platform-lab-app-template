name: release

# Explicit, structural dependency on the upstream lint/test/build/push
# pipeline actually succeeding -- not an inference from which paths this
# workflow happens to touch. workflow_run also fires for PR runs of "ci",
# so the job condition below additionally restricts to push events on main.
# workflow_run is flagged generically since it usually runs with full
# base-repo permissions regardless of a fork's involvement, but the
# job-level `if:` below requires workflow_run.event == 'push', which a
# fork's pull_request-triggered "ci" run can never satisfy -- verified by
# hand, not just this suppression.
on: # zizmor: ignore[dangerous-triggers] see comment above; gated on event == 'push' in the job's if:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

# Never cancel an in-flight release/promotion; queue instead, so
# overlapping releases can't race each other into the prod overlay.
concurrency:
  group: production-promotion
  cancel-in-progress: false

env:
  # ghcr.io/<owner>/<repo-name> -- fully dynamic, matching ci.yml. See the
  # comment there for why.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # Deliberately checks out current main, not the pinned commit that
      # triggered this run: by the time "ci" finishes (which is what
      # triggers this), its own update-dev-digest job has usually already
      # pushed a follow-up commit onto main. semantic-release refuses to
      # release from a commit it considers "behind" the remote HEAD, so
      # pinning here would be actively counterproductive.
      #
      # persist-credentials stays at its default (true) deliberately: the
      # final "Commit and push" step in this same job needs the credential
      # checkout leaves in .git/config to push at all, and nothing else in
      # this job runs untrusted third-party code that could read it out
      # from under a legitimate step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: # zizmor: ignore[artipacked] see comment above -- needed for this job's own later git push
          fetch-depth: 0 # semantic-release needs full history to analyze conventional commits

      - run: pip install --quiet pyyaml

      - name: Read the digest already validated in dev
        id: dev-digest
        run: |
          digest=$(python3 .github/scripts/read_image_digest.py deploy/overlays/dev/kustomization.yaml "$IMAGE")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6
        id: semantic
        with:
          semantic_version: 25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.semantic.outputs.new_release_published == 'true'

      # Testing GITHUB_TOKEN again now that IMAGE is dynamic -- see the
      # same note in ci.yml.
      - name: Log in to GHCR
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags the exact digest already built and validated in dev with the
      # new semver -- never rebuilds, per CLAUDE.md's promotion model.
      - name: Tag GHCR image with release version
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          NEW_VERSION: ${{ steps.semantic.outputs.new_release_version }}
          DEV_DIGEST: ${{ steps.dev-digest.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$NEW_VERSION" \
            "$IMAGE@$DEV_DIGEST"

      - name: Install kustomize
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          # install_kustomize.sh calls the unauthenticated GitHub releases
          # API to resolve the download URL -- shares the runner IP's 60/hr
          # rate limit with everything else hitting api.github.com, and was
          # observed failing ("Github rate-limiter failed the request") on
          # the platform repo's own CI. Downloading the pinned release
          # asset directly bypasses the API entirely.
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/kustomize_v5.4.2_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Promote the same digest to prod
        if: steps.semantic.outputs.new_release_published == 'true'
        working-directory: deploy/overlays/prod
        env:
          DEV_DIGEST: ${{ steps.dev-digest.outputs.digest }}
        run: kustomize edit set image "$IMAGE=$IMAGE@$DEV_DIGEST"

      - name: Commit and push
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          NEW_VERSION: ${{ steps.semantic.outputs.new_release_version }}
          DEV_DIGEST: ${{ steps.dev-digest.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/prod/kustomization.yaml
          git commit -m "chore(deploy): promote hello-world@${DEV_DIGEST} (${NEW_VERSION}) to prod"
          git push origin main
